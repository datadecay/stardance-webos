<div class="sidebar">
    <ul>
        <li onclick="window.confApp.openConfig('config1-content')">General</li>
        <li onclick="window.confApp.openConfig('config2-content')">Personalization</li>
        <li onclick="window.confApp.openConfig('config3-content')">Installed Apps</li>
        <li onclick="window.confApp.openConfig('config4-content')">Info</li>
        <li onclick="window.confApp.openConfig('config5-content')">Your Data</li>


    </ul>
</div>

<div class="main-content">
    <h1>Config</h1>

    <div id="config1-content">
        <form>
            <label>WIP coming soon</label>
            <input type="submit" value="Save">
        </form>
    </div>
    <div id="config2-content" style="display: none;">
        <form>
            <input type="color" id="theme-color">
            <label for="theme-color">Theme Color</label>
            <br>
            <input type="color" id="theme-color2">
            <label for="theme-color2">Secondary Theme Color</label>
            <br>
            <input type="file" accept="image/*" id="theme-image">
            <label for="theme-image">Wallpaper</label>
            <br>
            <label for="theme-vars">Override CSS Variables</label>
            <textarea id="theme-vars" rows="5" placeholder="--primary: #111111;"></textarea>
            <br>
            <label for="theme-css">Override CSS Rules</label>
            <textarea id="theme-css" rows="8" placeholder=".window { border-radius: var(--window-radius); }"></textarea>
            <br>
            <label for="registered-theme">Themes</label>
            <ul id="registered-theme" style="display: flex; gap: 10px; flex-wrap: wrap; list-style: none;"></ul>
            <button type="button" id="unregister-theme">Remove Theme</button>
            <br>
            <label for="register-theme-json">Load Theme JSON File</label>
            <input type="file" accept="application/json,.json" id="register-theme-json">
            <button type="button" id="register-theme-json-btn">Load</button>
            <br>
            <input type="submit" value="Save">
        </form>
    </div>
    <div id="config3-content" style="display: none;">
        <h2>Installed Apps</h2>
        <ul id="installed-user-apps-list">
        </ul>
    </div>
    <div id="config4-content" style="display: none;">
        <h2>Info</h2>
        <ul id="info-list">
        </ul>
    </div>
    <div id="config5-content" style="display: none;">
        <h2>Your Data</h2>
        <button id="delete-data">Delete Data</button>
    </div>
</div>
